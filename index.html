<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Kod Deneme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        textarea {
            width: 80%;
            height: 150px;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 14px;
        }
        iframe {
            width: 80%;
            height: 300px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Canlı Kod Deneme</h1>
    <textarea id="code" placeholder="HTML + CSS + JS kodunu buraya yaz..."></textarea>
    <button onclick="runCode()">Çalıştır</button>
    <iframe id="output"></iframe>

    <script>
        function runCode() {
            const code = document.getElementById('code').value;
            const iframe = document.getElementById('output');
            iframe.srcdoc = code;
        }
    </script>
</body>
</html>
